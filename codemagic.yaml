workflows:
  android-apk:
    name: Masjid Al Maghfira - Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.masjidalmaghfira.app"
    scripts:
      - name: Generate Android platform folder (if missing)
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=masjid_al_maghfira --org=com.masjidalmaghfira .
          fi
      - name: Set app label to Arabic name
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="masjid_al_maghfira"/android:label="مسجد المغفرة"/' "$MANIFEST"
            if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
              sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
            fi
          fi
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons || true
      - name: Build Android APK (release, unsigned)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients: []
